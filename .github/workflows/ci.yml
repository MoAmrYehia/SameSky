name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clean install
        run: pip install -r requirements-dev.txt
      - name: Privacy, authorization, availability, media and realtime tests
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: sqlite:////tmp/ci-migrations.db
          SAMESKY_SECRET_KEY: ci
        run: |
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (time-zone engine)
        run: npm test
      - name: Production build
        run: npm run build
