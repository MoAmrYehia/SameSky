name: Deploy web to GitHub Pages

# Publishes the WebXR room and the companion (web/) as the judged build:
#   https://<owner>.github.io/<repo>/            companion → "Try a sample day" / "Enter the room in VR"
#   https://<owner>.github.io/<repo>/room.html   the IWSDK WebXR room (opens the sample day)
# GitHub Pages is static, so this build is sample-only (VITE_SAMPLE_ONLY=1): no sign-in, no API calls.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Build (served under /<repo>/, sample-only)
        env:
          SAMESKY_BASE: /${{ github.event.repository.name }}/
          VITE_SAMPLE_ONLY: "1"
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}room.html
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
